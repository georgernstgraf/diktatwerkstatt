[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/georgernstgraf/diktatwerkstatt"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
thiserror = "2"
tempfile = "3"
